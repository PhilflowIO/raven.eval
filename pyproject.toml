[project]
name = "raven-eval-core"
version = "0.1.0"
description = "Standalone, dependency-standard DER + WER scoring — the metric core of the raven.eval public benchmark."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "raven.eval" }]
dependencies = [
    "pyannote.metrics>=3.2",
    "jiwer",
    "num2words",
    "numpy",
    # Tier-1 re-scorer (scripts/verify.py) mirrors german-asr's flozi WER
    # pipeline exactly, which needs these two pure-python libs (no GPU/torch):
    "unidecode",     # foreign-diacritic transliteration (umlauts preserved)
    "text2num",      # alpha2digit(de): German number words -> digits (imports as text_to_num)
    # BLEU for translation-shaped corpora (Swiss-German dialect spoken / standard
    # German transcribed). BASE dependency, deliberately not behind an extra: the
    # Tier-1 re-scorer (scripts/verify.py) re-scores committed BLEU rows and CI
    # runs it after `uv sync --locked --extra dev` only. sacrebleu is pure python
    # (colorama/lxml/numpy/portalocker/regex/tabulate) — no torch, no GPU.
    # Floor at 2.4: `BLEU(..., references=…)` and the signature API this repo
    # relies on are stable from there. Capped below 3 because a major release is
    # exactly where a tokenizer default could move and silently shift every
    # published BLEU; the signature records the exact version per number.
    "sacrebleu>=2.4,<3",
]

[project.optional-dependencies]
dev = ["pytest"]
# Tier-2 harness (raven_asr): download public HF datasets, run remote/GPU
# inference, score. Heavier than the Tier-1 core — install only to re-run from
# raw audio. Adapters talk to their APIs over httpx directly; only the Modal
# adapter needs an extra SDK (kept separate so the base install stays lean).
asr = [
    "datasets",
    "soundfile",
    "numpy",
    "tqdm",
    "pyyaml",
    "httpx",
]
modal = ["modal"]
# Tier-2 DER harness (raven_diar): run the pinned diarizer over public audio and
# score DER. HEAVY (torch + pyannote.audio + a GPU + the gated community-1 model)
# — isolated here so the Tier-1 DER re-score (scripts/verify.py) and `make verify`
# stay light: they need only raven_eval_core.der (pyannote.metrics, no torch).
diar = [
    "pyannote.audio>=4.0",
    "torch",
    "torchaudio",
    "huggingface-hub",
    "datasets",
    "soundfile",
    "numpy",
]
# Tier-2 DER, HOSTED-API lane (raven_diar/adapters/{deepgram,assemblyai}.py and
# the hosted adapters that follow them). No torch, no GPU, no model weights: an
# HTTP client plus the dataset loader is the whole runtime. One extra for the
# lane rather than one per vendor — a second name for the same dependency set is
# how the two drift apart. Its own extra so running a hosted diarizer never
# drags in a multi-GB local-inference stack, and so the Tier-1 re-score path
# stays untouched by any of it. Adapters import httpx lazily, so listing the
# registry works without this extra at all.
diar-hosted = [
    "httpx",
    "datasets",
    "soundfile",
    "numpy",
]
# Tier-2 DER, NVIDIA Sortformer lane (raven_diar/adapters/sortformer.py). Its own
# extra because nemo_toolkit is a large, opinionated dependency tree of its own:
# nobody should have to install it to score DER, to run the pyannote lane, or to
# run the tests. The adapter imports nemo lazily, so the repo stays installable
# and fully testable without this extra.
sortformer = [
    "nemo_toolkit[asr]>=2.0",
    "torch",
    "huggingface-hub",
    "soundfile",
    "numpy",
]

# Tier-2 DER, DiariZen lane (raven_diar/adapters/diarizen.py). Its own extra and
# NOT compatible with `diar`: DiariZen vendors a modified pyannote.audio 3.1.1
# inside its own repository, the two import each other, and the fork changes
# signatures the pipeline calls — so upstream pyannote.audio is not a substitute
# and 3.1.1 cannot coexist with the >=4.0 the pyannote lane needs. Both halves
# therefore come from the SAME pinned DiariZen commit.
#
# The runtime dependencies are listed here rather than inherited, because
# DiariZen's own pyproject declares NONE (its requirements.txt is a development
# superset that pulls jupyterlab and tensorboard). What is listed is what the
# inference path actually imports; torch and numpy are pinned to the pair the
# fork is known to run on, since 3.1.1-era pyannote does not survive numpy 2.
diarizen = [
    "diarizen @ git+https://github.com/BUTSpeechFIT/DiariZen@a60b18151dbbe246e4199d8ef5cd2ece3872ea94",
    "pyannote.audio @ git+https://github.com/BUTSpeechFIT/DiariZen@a60b18151dbbe246e4199d8ef5cd2ece3872ea94#subdirectory=pyannote-audio",
    "torch==2.1.1",
    "torchaudio==2.1.1",
    "numpy==1.26.4",
    "accelerate==1.6.0",   # diarizen/utils.py imports it; not optional
    "psutil",
    "toml",
    "einops",
    "scipy",
    "soundfile",
    "huggingface-hub",
    "datasets",
]

[tool.uv]
# `diar` (pyannote.audio>=4.0), `sortformer` (NeMo's torch) and `diarizen`
# (pyannote.audio 3.1.1 + torch 2.1.1) are mutually exclusive by construction.
# Declaring that lets uv lock each lane instead of failing to find one
# resolution that satisfies all three — which is also the honest statement:
# nobody installs two diarizer backends to run one.
conflicts = [
    [{ extra = "diar" }, { extra = "diarizen" }],
    [{ extra = "sortformer" }, { extra = "diarizen" }],
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
# The `diarizen` extra pins two packages by git URL (see that extra's comment:
# the library and its vendored pyannote fork must come from the same commit, and
# neither is on PyPI). Hatchling refuses direct references unless told to allow
# them. It applies only to that one optional extra; every other dependency here
# is a normal version range from PyPI.
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["raven_eval_core", "raven_asr", "raven_diar"]

[tool.pytest.ini_options]
testpaths = ["tests"]
