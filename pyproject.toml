[project]
name = "raven-eval-core"
version = "0.1.0"
description = "Standalone, dependency-standard DER + WER scoring — the metric core of the raven.eval public benchmark."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "raven.eval" }]
dependencies = [
    "pyannote.metrics>=3.2",
    "jiwer",
    "num2words",
    "numpy",
    # Tier-1 re-scorer (scripts/verify.py) mirrors german-asr's flozi WER
    # pipeline exactly, which needs these two pure-python libs (no GPU/torch):
    "unidecode",     # foreign-diacritic transliteration (umlauts preserved)
    "text2num",      # alpha2digit(de): German number words -> digits (imports as text_to_num)
    # BLEU for translation-shaped corpora (Swiss-German dialect spoken / standard
    # German transcribed). BASE dependency, deliberately not behind an extra: the
    # Tier-1 re-scorer (scripts/verify.py) re-scores committed BLEU rows and CI
    # runs it after `uv sync --locked --extra dev` only. sacrebleu is pure python
    # (colorama/lxml/numpy/portalocker/regex/tabulate) — no torch, no GPU.
    # Floor at 2.4: `BLEU(..., references=…)` and the signature API this repo
    # relies on are stable from there. Capped below 3 because a major release is
    # exactly where a tokenizer default could move and silently shift every
    # published BLEU; the signature records the exact version per number.
    "sacrebleu>=2.4,<3",
]

[project.optional-dependencies]
dev = ["pytest"]
# Tier-2 harness (raven_asr): download public HF datasets, run remote/GPU
# inference, score. Heavier than the Tier-1 core — install only to re-run from
# raw audio. Adapters talk to their APIs over httpx directly; only the Modal
# adapter needs an extra SDK (kept separate so the base install stays lean).
asr = [
    "datasets",
    "soundfile",
    "numpy",
    "tqdm",
    "pyyaml",
    "httpx",
]
modal = ["modal"]
# Tier-2 DER harness (raven_diar): run the pinned diarizer over public audio and
# score DER. HEAVY (torch + pyannote.audio + a GPU + the gated community-1 model)
# — isolated here so the Tier-1 DER re-score (scripts/verify.py) and `make verify`
# stay light: they need only raven_eval_core.der (pyannote.metrics, no torch).
diar = [
    "pyannote.audio>=4.0",
    "torch",
    "torchaudio",
    "huggingface-hub",
    "datasets",
    "soundfile",
    "numpy",
]
# Tier-2 DER, NVIDIA Sortformer lane (raven_diar/adapters/sortformer.py). Its own
# extra because nemo_toolkit is a large, opinionated dependency tree of its own:
# nobody should have to install it to score DER, to run the pyannote lane, or to
# run the tests. The adapter imports nemo lazily, so the repo stays installable
# and fully testable without this extra.
sortformer = [
    "nemo_toolkit[asr]>=2.0",
    "torch",
    "huggingface-hub",
    "soundfile",
    "numpy",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["raven_eval_core", "raven_asr", "raven_diar"]

[tool.pytest.ini_options]
testpaths = ["tests"]
