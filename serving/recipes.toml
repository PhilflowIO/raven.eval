notes = "NVIDIA's bf16 release (nvidia/NVIDIA-Nemotron-3.5-Transcribe-30B-A4B@c17667641642c4265ff2b7037dd101b7d4567634, 67.5 GB) does not fit two 24 GB cards with room to serve, and NVIDIA's FP8 build quantizes the audio encoder too, whose FP8 GEMM has no sm86 kernel. This is our own build of it, made by serving/quantize/nemotron_transcribe_w8a16.py: every Linear of the language model's decoder layers (6004) in int8, one scale per output channel, symmetric round-to-nearest, no calibration data; the audio encoder (perception) and its projector, the CTC timestamp head, MTP layers, embeddings, lm_head, MoE routers, Mamba conv1d and every norm stay bit-identical bf16/fp32. Checkpoint hash (sha256 of its SHA256SUMS, serving/quantize/nemotron_transcribe_w8a16.SHA256SUMS): c65f885abdb13143e7f003d8aab827215e1b9aed62b03a23b24cb846dd386638. ~36 GB, ~18 GB per card at TP 2. Served as compressed-tensors W8A16 with bf16 activations; the launcher pins Marlin for the dense linears (Humming disabled) and for the experts (--moe-backend marlin), as the scheme says. Loaded by NeMo Speech's vLLM plugin (vllm_plugins, pinned in vllm/requirements.txt); --trust-remote-code is the card's own flag. The shim sends the card's chat request (verbatim benchmark instruction, reasoning off); its instruction says 'Language: as spoken', so the model is NOT forced to German. Its control is nemotron-3.5-transcribe-30b-a4b-bf16-control. License OpenMDW-1.1, as the source. German: the card lists 'German ✓ Leading' and reports FLEURS German WER 2.73 and CoVoST2 German 2.98 — https://huggingface.co/nvidia/NVIDIA-Nemotron-3.5-Transcribe-30B-A4B"

