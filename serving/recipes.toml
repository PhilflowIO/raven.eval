# Serving recipes of the 24 self-hosted models (raven_asr.config.SELF_HOSTED_MODELS).
#
# One table per model, keyed by the model's result-directory label. `launch.py`
# turns a table into the server process; the servers report the table's id and
# content hash (`recipe.py`) as `x_raven.recipe` in every response, and the
# harness records it in summary.json. Edit a table and every later run names the
# new hash — that is the point.
#
# Common keys
#   model        HF repo id. The server serves and reports exactly this id.
#   revision     the full HF commit the weights, tokenizer and processor are loaded
#                at. Required for every recipe: a repo id alone moves whenever the
#                publisher re-uploads, and the recipe would then serve other weights
#                than it was measured with.
#   engine       vllm | nemo | transformers (a stand-in for a model vLLM cannot load)
#   weights_gb   download size, for the optional free-disk check (RAVEN_SERVE_MIN_FREE_GB)
#   gpu_mem      default VRAM budget as a fraction of the card (RAVEN_SERVE_GPU_MEM
#                overrides). vLLM pre-allocates it; NeMo and transformers cap torch to it.
#                The defaults were sized on a 24 GB card shared with other tenants: they
#                are the smallest budget the model serves with, not a recommendation.
#   chunking     what happens to audio longer than the model takes in one pass, and
#                where. The harness sends one utterance per request and never chunks.
#   notes        why a value is what it is, where that is not obvious, and for every
#                model added since 2026-11 the model card's own German evidence
#                (quote + URL), so the reason a model is in a German benchmark is
#                on record next to how it is served
#   decoding     how the model decodes and how long its output may get (recipe.py,
#                DECODING_KEYS). mode is "greedy" everywhere. Servers report the
#                table as x_raven.decoding; every run records it.
#
#   precision    the number format of the served weights and of the computation,
#                and where the weights come from (recipe.py, PRECISION_KEYS):
#                weights, activations, scheme ("none" = plain floating point,
#                else the quantization scheme), checkpoint (source "published" /
#                "vendor" / "self", and the dtype the checkpoint stores, so a cast
#                is on record) and tensor_parallel (GPUs per model instance; the
#                launcher wants exactly that many). Servers report the table as
#                x_raven.precision; every run records it, and a change aborts the
#                run like any other change of the serving block.
#
# Precision of the recipes below (2026-11-02), read from each checkpoint at its
# pinned commit (safetensors headers; for NeMo the .nemo's size against its
# parameter count and the repo's fp32 safetensors) and from how the engine loads
# it with these flags:
#   vLLM          --dtype is precision.activations, so weights and computation
#                 are in that format; nothing is left to vLLM's "auto". A
#                 quantized checkpoint's weights are in the format its
#                 quantization_config names, and the launcher pins the kernel
#                 the scheme names (recipe.py, VLLM_SCHEMES: environment and flags).
#   NeMo          (the pinned commit, as 3.0.0 before it) restore_from keeps the
#                 stored fp32 and transcribe() runs no
#                 autocast: fp32 throughout (PyTorch defaults, i.e. TF32 for
#                 cuDNN convolutions on Ampere and later). The server checks the
#                 restored parameters against precision.weights and refuses to
#                 serve when they differ.
#   transformers  the stand-in loads with dtype = precision.weights (the same
#                 format transformers 5's default dtype="auto" reads from
#                 config.json) and checks the loaded parameters the same way;
#                 modules a model keeps in fp32 by design (turboctc's conv norms)
#                 stay fp32.
# Every recipe serves its checkpoint's own format. primeline-whisper-large-v3-german
# served an fp16 cast of its bf16 checkpoint until 2026-11-02 (#82, see its notes).
#
# Output length. vLLM and the transformers stand-in get max_tokens = 1024. The
# longest reference in any WER dataset here is 686 UTF-8 bytes (voxpopuli-de);
# every tokenizer these models use spends at least one byte per token, so no
# faithful transcript of any utterance needs more than 686 tokens, MOSS's
# timestamp and speaker markup included (its longest non-looping answer on the
# 2026-11 sweep: 652 characters). In Phi-4's tokenizer that reference is 145
# tokens, so 1024 is ~1.5x the byte bound and ~7x the real length. What the cap
# does decide is how much a looping answer costs: until now it was the engine's
# default (max_model_len, a generation_config max_new_tokens, or the shim's 4096
# for Phi-4) and differed from model to model by up to 30x.
# vLLM takes the smallest of max_tokens, max_model_len and the model's own
# generation_config limit, so for Whisper (max_length 448) 448 still applies.
# vLLM splits audio longer than a model's clip limit and the cap holds per piece.
# NeMo models generate under their checkpoint's decoding config, which the server
# checks against the table and never changes. A CTC model on the transformers
# stand-in (granite-speech-5.0-470m-turboctc) emits one label per encoder frame
# in a single forward pass: there is no generation loop, so max_tokens bounds
# nothing there and the stand-in does not apply it.
#
# vllm keys: max_num_seqs (default; RAVEN_SERVE_MAX_NUM_SEQS overrides),
#   max_model_len, trust_remote_code, args (further `vllm serve` flags, verbatim;
#   never --dtype or --tensor-parallel-size, which precision owns),
#   snapshot_ignore (patterns left out of the snapshot download), serve_from_snapshot
#   (serve the local snapshot under the model id instead of letting vLLM download),
#   lora_modules (name = directory inside the snapshot), vllm_plugins (the vLLM
#   plugins this model needs, recipe.VLLM_PLUGINS; the launcher sets VLLM_PLUGINS to
#   exactly this list, empty for every other model)
# transformers keys: model_class (required: the transformers class that loads the
#   model; vllm/transformers_server.py serves only the classes it lists), max_num_seqs
# nemo keys: checkpoint_file (required: the .nemo inside the HF repo; the launcher
#   downloads it at `revision` and the server restores exactly that file, because
#   ASRModel.from_pretrained takes no revision), max_batch, batch_wait_ms,
#   batch_max_audio_s, longform
#
# Every vLLM model is reached through vllm/shim.py, which forwards to vLLM's own
# /v1/audio/transcriptions, except Phi-4-multimodal and VibeVoice-ASR, whose vLLM
# classes have no transcription endpoint: the shim turns the request into a chat
# completion (Phi-4: for the speech LoRA). Decoding is greedy everywhere: the shim sends temperature 0,
# repetition_penalty 1.0 and the recipe's max_tokens with every request.

# ── NeMo ────────────────────────────────────────────────────────────────────

