notes = "The bf16 control of voxtral-small-24b-2507-fp8, run on FLEURS-de only. consolidated.safetensors (48.5 GB) is ~24.3 GB per card at TP 2; --cpu-offload-gb 14 (per GPU, vllm/config/offload.py:23-32) keeps ~14 GB of each card's share in pinned host RAM (28 GB of the host's 125 GB) and streams it over PCIe in every forward pass, which leaves ~8 GB per card for the KV cache and activations at gpu_mem 0.9. Slow by design; the numbers it produces are the bf16 model's. The weights are the ones RedHat quantized: consolidated.safetensors has the same LFS sha256 (421cd598…abea7e) at the repo's first commit (2025-07-15) and at the pinned one."

