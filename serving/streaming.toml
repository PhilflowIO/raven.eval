# Streaming recipes: how each streaming-capable self-hosted model is served LIVE.
#
# A stream recipe sits on top of the model's offline recipe (recipes.toml,
# `base`): the weights revision, checkpoint file, precision and engine pins are
# the offline recipe's, so a streaming number and an offline number name the
# same weights in the same number format. What a stream recipe adds is the
# model's own documented streaming mode and its latency setting, quoted from the
# model card at the pinned revision — never a setting of our own.
#
# serving/streaming.py validates these tables and hashes each one together with
# its base recipe's hash and every file the live path runs through; the
# capacity harness (python -m raven_asr.stream) records that hash per run.
#
# One latency class for every model: ~0.5 s of algorithmic latency, the point
# each card offers that is closest to Voxtral's own default delay (480 ms). The
# curves are only comparable across models at one latency class.
#
# Keys
#   base         offline recipe id in recipes.toml
#   protocol     vllm-realtime: vLLM's own /v1/realtime websocket (OpenAI-style
#                realtime events), served by `vllm serve` itself;
#                nemo-pipeline: serving/nemo/stream_server.py, which speaks the
#                same protocol and steps every live session through NeMo's
#                streaming inference pipeline (nemo.collections.asr.inference)
#   chunk_ms     how much audio the client sends per message, in real time:
#                the model's own frame (Voxtral, 80 ms per decoded token) or
#                streaming chunk (NeMo; the server refuses a mismatch)
#   gpu_mem      VRAM budget as a fraction of the card (vLLM pre-allocates it;
#                the NeMo server caps torch to it)
#   latency      the documented setting this recipe serves, in words
#   notes        why, with the card quote
# vllm-realtime keys: max_num_seqs (sessions the engine runs at once; at least
#   the largest N stepped, or the scheduler queues sessions and the curve
#   measures the cap, not the GPU)
# nemo-pipeline keys: pipeline ("cache_aware" | "buffered", the vendored config
#   in serving/nemo/conf), lang (the language prompt), batch_size (frames per
#   pipeline step), num_slots (cache-aware: live streams the context manager
#   holds), matmul_precision, and the context: att_context_size (cache-aware,
#   in 80 ms encoder frames) or left_context_s / chunk_s / right_context_s
#   (buffered)
#
# Precision: every NeMo stream recipe runs fp32 like its offline recipe (the
# checkpoint's own format; compute_dtype float32, matmul_precision highest =
# PyTorch's default), not the vendored config's bfloat16, so the streaming WER
# differs from the offline WER by the streaming mode alone.

[streams."voxtral-mini-4b-realtime-2602"]
base = "voxtral-mini-4b-realtime-2602"
protocol = "vllm-realtime"
chunk_ms = 80
gpu_mem = 0.85
max_num_seqs = 128
latency = "transcription_delay_ms = 480, the checkpoint's own tekken.json value at the pinned revision"
notes = "vLLM 0.33.0 serves VoxtralRealtimeGeneration's realtime task on /v1/realtime (vllm/entrypoints/speech_to_text/realtime): session.update names the model, input_audio_buffer.commit starts an utterance, input_audio_buffer.append carries base64 PCM16 16 kHz, commit with final = true ends the audio, transcription.delta streams text and transcription.done closes the utterance. The engine is the base recipe's `vllm serve` command; only the session cap and the memory budget differ: max_num_seqs 128 so 128 live sessions run at once, gpu_mem 0.85 (20.9 GB of a 24 GB card) for their KV cache. The card: 'transcription delay of 480ms ... sweet spot' — https://huggingface.co/mistralai/Voxtral-Mini-4B-Realtime-2602"

[streams."nvidia-nemotron-3.5-asr-streaming-0.6b"]
base = "nvidia-nemotron-3.5-asr-streaming-0.6b"
protocol = "nemo-pipeline"
pipeline = "cache_aware"
att_context_size = [56, 6]
chunk_ms = 560
lang = "de-DE"
batch_size = 128
num_slots = 256
matmul_precision = "highest"
gpu_mem = 0.85
latency = "att_context_size [56, 6]: chunk of 7 x 80 ms = 0.56 s, cache-aware"
notes = "The card's streaming setting table: '[56, 6]: Chunk size = 7 (7 x 80ms = 0.56s)', of the documented [56,0] / [56,1] / [56,3] / [56,6] / [56,13]; chunk = current frame + right context, non-overlapping. Served through NeMo's CacheAwareRNNTPipeline (cache_aware_rnnt.yaml at the NeMo pin), which keeps one cache slot per live stream and steps every ready stream in one batch; the language prompt de-DE as in the offline recipe. https://huggingface.co/nvidia/nemotron-3.5-asr-streaming-0.6b"

[streams."nvidia-nemotron-labs-unified-asr-0.6b"]
base = "nvidia-nemotron-labs-unified-asr-0.6b"
protocol = "nemo-pipeline"
pipeline = "buffered"
left_context_s = 5.6
chunk_s = 0.16
right_context_s = 0.40
chunk_ms = 160
lang = "de"
batch_size = 128
matmul_precision = "highest"
gpu_mem = 0.85
latency = "left 5.6 s / chunk 0.16 s / right 0.40 s: 0.56 s latency, buffered"
notes = "The card's recommended context table, row 'Left 5.6 / Chunk 0.16 / Right 0.40 / Latency (C+R) 0.56'. The card's own limitation: 'The current streaming inference pipeline is buffered, not cache-aware: the left context is recomputed at every chunk step' — so this model costs more per stream than the cache-aware one by design. Served through NeMo's BufferedRNNTPipeline (buffered_rnnt.yaml at the NeMo pin, stateful) with the chunked self-attention masks the card's streaming script sets (att_context_size_as_chunk = true: encoder.set_default_att_context_size([left, chunk, right]) in 80 ms encoder frames, for an att_context_style of chunked_limited_with_rc). Language prompt 'de' as the card shows. https://huggingface.co/nvidia/nemotron-labs-unified-asr-0.6b"

[streams."moonshine-streaming-small-de"]
base = "moonshine-streaming-small-de"
protocol = "moonshine-voice"
runtime = "moonshine-voice==0.1.6"
device = "cpu"
model_url = "https://download.moonshine.ai/model/small-streaming-de/quantized_26_08_24"
model_arch = 4
update_interval_s = 0.5
chunk_ms = 100
precision = { weights = "int8", activations = "int8", scheme = "ort-int8-per-channel", tensor_parallel = 1, checkpoint = { source = "vendor", url = "https://download.moonshine.ai/model/small-streaming-de/quantized_26_08_24", dtype = "int8" } }
files = { "adapter.ort" = "be438a3eb12ba3697a9e474d20f899e52d8e27b43a6fc4c4c809d2a099646744", "cross_kv.ort" = "0c329cbf001bebbb9e34835e95676b9eb29e010405da46f65af511b8da16620e", "decoder_kv.ort" = "7da8ac9a1da2a486158ccde88c756fd876bf7f11ef1c2ba14b80e8edcd30028c", "encoder.ort" = "f31ef482f940e23af87906aeec986bf2e0a4862cad577bbc745264caab5a1858", "frontend.model.ort" = "a93453223d93aa41d21691568cde3a01125fe00710a5f7004a825e1a322d3025", "frontend.weights.ort" = "8b417e2e0ee762e34d7163d24383823bb8bd1d037fb6966c32b3f86a3de4961f", "streaming_config.json" = "12d16c7f5ea6734d197b79baf47914ea7e996d6fca8d303a19aca10d0617cecc", "tokenizer.bin" = "5725ad3771a1339802f8cebeda0fa8f7723f5282b1ee726c2544774d7399b9a7" }
transcribers = "shared"
ort_threads = "vendor"
latency = "vendor default: transcript update every 0.5 s of input, ~80 ms encoder lookahead"
notes = "The vendor's own streaming runtime, the way the model is meant to stream: transformers 5.20.2 has only a whole-utterance generate() for MoonshineStreamingForConditionalGeneration. moonshine-voice 0.1.6 (PyPI) resolves language 'de' to Small Streaming (ModelArch 4) at download.moonshine.ai/model/small-streaming-de/quantized_26_08_24 and pins its eight files by size and CRC32C (core/moonshine-model-file-metadata.generated.cpp at v0.1.6); the server checks the sha256 of each. The model card: 'The .ort package served to the Moonshine deployment library is quantized to int8 from these same weights' (tokenizer vocab 12,288 in both). Precision is the vendor's, NOT the offline recipe's fp32: int8 per-channel weights and int8 MatMul (docs/models/quantization.md; the frontend convolutions dequantize to float at load). ONNX Runtime on the CPU execution provider only ('cpu is the only value any shipped build accepts', docs/execution-providers.md), so this curve is a CPU curve and never comparable to a GPU row without that label. One Transcriber, one stream per utterance (Transcriber.create_stream, the documented path for several live sources; the library's entry points are thread-safe, core/transcriber-concurrency-test.cpp), audio fed in the docs' 100 ms chunks, the default update interval of 0.5 s, ONNX Runtime's default thread pool. https://huggingface.co/moonshine-ai/moonshine-streaming-small-de"


# ── Tuning variants (#119) ──────────────────────────────────────────────────
# Named variants of the two Nemotron recipes above, measured to find where each
# model's live capacity really ends and what a setting the card allows buys.
# They are NOT the published comparison recipes: those stay the model's own
# documented setting at the shared ~0.5 s latency class. Each variant changes
# one lever (or a stated combination) against its base recipe and says which.

[streams."nvidia-nemotron-3.5-asr-streaming-0.6b-slots1024"]
base = "nvidia-nemotron-3.5-asr-streaming-0.6b"
protocol = "nemo-pipeline"
pipeline = "cache_aware"
att_context_size = [56, 6]
chunk_ms = 560
lang = "de-DE"
batch_size = 256
num_slots = 1024
matmul_precision = "highest"
gpu_mem = 0.85
latency = "att_context_size [56, 6]: chunk of 7 x 80 ms = 0.56 s, cache-aware (1024 slots, 256 per step)"
notes = "The published recipe with room for more live streams: num_slots 1024 (the context manager holds one cache slot per live stream, so 256 slots cap the curve at 256 sessions) and batch_size 256 (frames per pipeline step). 512 per step does not fit next to 1024 slots in the 0.85 budget: the slot cache is ~5 MiB per slot, and NeMo's CacheAwareContextManager copies a step's slots out and back (get_context, update_cache's index_select), ~2.5 GiB transient per 512-frame step, which ran out of memory in the preflight (2026-11-10). Same card setting, precision and language prompt as the published recipe. https://huggingface.co/nvidia/nemotron-3.5-asr-streaming-0.6b"

[streams."nvidia-nemotron-labs-unified-asr-0.6b-tf32"]
base = "nvidia-nemotron-labs-unified-asr-0.6b"
protocol = "nemo-pipeline"
pipeline = "buffered"
left_context_s = 5.6
chunk_s = 0.16
right_context_s = 0.40
chunk_ms = 160
lang = "de"
batch_size = 128
matmul_precision = "high"
gpu_mem = 0.85
latency = "left 5.6 s / chunk 0.16 s / right 0.40 s: 0.56 s latency, buffered; TF32 matmuls"
notes = "Precision lever alone: the card's 0.56 s row (Left 5.6 / Chunk 0.16 / Right 0.40) with fp32 weights and activations as published, but matmuls in TF32 (torch.set_float32_matmul_precision('high'), which NeMo's PipelineBuilder sets from matmul_precision; 10-bit mantissa on the tensor cores). https://huggingface.co/nvidia/nemotron-labs-unified-asr-0.6b"

[streams."nvidia-nemotron-labs-unified-asr-0.6b-left3"]
base = "nvidia-nemotron-labs-unified-asr-0.6b"
protocol = "nemo-pipeline"
pipeline = "buffered"
left_context_s = 3.04
chunk_s = 0.16
right_context_s = 0.40
chunk_ms = 160
lang = "de"
batch_size = 128
matmul_precision = "highest"
gpu_mem = 0.85
latency = "left 3.04 s / chunk 0.16 s / right 0.40 s: 0.56 s latency, buffered"
notes = "Context lever: the left context cut from 5.6 s to ~3 s at the same 0.56 s latency. The card: 'To accelerate the streaming inference, one can reduce the left context to about 3-2s with possible accuracy degradation' and 'We recommend not decreasing the left context below 2s'. 3.04 s = 38 encoder frames of 80 ms (3.0 s is no whole frame; NeMo's buffered pipeline would round it up to 3.04 s anyway). Each chunk step recomputes left + chunk + right = 3.6 s instead of 6.16 s. https://huggingface.co/nvidia/nemotron-labs-unified-asr-0.6b"

[streams."nvidia-nemotron-labs-unified-asr-0.6b-left2"]
