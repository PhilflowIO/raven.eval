name: ci
on:
  push:
  # SECURITY: this workflow runs fork-authored PR code. Do NOT add any secrets
  # or Tier-2 API keys (Deepgram/OpenAI/Mistral/Modal/HF) to it — a malicious PR
  # could exfiltrate them. The day a key-bearing Tier-2 job is wired, it must run
  # under `pull_request_target` with an explicit maintainer-approval gate, never here.
  pull_request:

# Least privilege: this is a test/verify pipeline — it never writes to the repo.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86  # v5
        with:
          enable-cache: true
      - name: Run scorer + harness tests
        run: uv run --locked --extra dev --extra asr pytest -q

  # Tier-1 proof: re-scores the committed predictions_*.jsonl and asserts each
  # subset's WER/CER matches the committed expected.json — the guarantee that
  # our numbers are reproducible without a GPU. Fails the build on any drift.
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86  # v5
        with:
          enable-cache: true
      - name: Sync environment
        run: uv sync --locked --extra dev
      - name: Tier-1 re-score committed predictions
        run: uv run python scripts/verify.py
