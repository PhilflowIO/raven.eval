# raven.eval — scoring contract
# Every published number is produced under exactly this config. Changing any
# field here changes the numbers; the config is committed so third parties see
# the precise rules our DER/WER values were computed under.

# Which of the top-level blocks below are metric contracts. Named explicitly,
# because deriving it as "everything that is not `datasets`" turns any new
# top-level key — publication rules, provenance notes — into a metric that the
# contract test then demands an implementation for. The list is checked in both
# directions against raven_eval_core.SCORED_METRICS.
metrics: [der, wer, bleu]

der:
  scorer_primary: pyannote.metrics      # dscore cross-check WIRED (optional): make dscore-check / raven_diar.dscore_check — gated on a local DSCORE_DIR checkout (dscore is not pip-installable), skips cleanly, not in CI
  # DER is reported TWICE — the two conventions are NOT comparable, so we publish both:
  variants:
    - name: full            # pyannote / DIHARD convention
      collar: 0.0
      skip_overlap: false
    - name: classic         # NIST / CALLHOME convention (Raven's historical value)
      collar: 0.25
      skip_overlap: false
  speaker_mapping: hungarian   # optimal, via scipy.linear_sum_assignment
  vad: automatic               # no oracle VAD, no oracle #speakers, no per-dataset tuning

wer:
  scorer: jiwer
  # The published WER numbers are produced by the flozi-strict method:
  #   unidecode transliteration + alpha2digit (number WORDS -> digits) +
  #   jiwer wer_standardize_contiguous transforms, corpus aggregation, raw-text CER.
  # This is NOT the strict-de lens (that one lowercases inline, runs num2words in the
  # opposite digits->words direction, and strips fillers) — see the reconciliation
  # note in the header of scripts/verify.py for why the two do not interchange.
  normalization: flozi-strict
  also_reported: [permissive, verbatim, cer, ier]   # diagnostic lenses in raven_eval_core.wer, not the published number

bleu:
  scorer: sacrebleu                 # rejected: nltk.translate.bleu_score — no pinned tokenizer, so the single most score-moving convention would sit outside this contract
  # BLEU is reported for TRANSLATION-SHAPED corpora only: Swiss-German dialect is
  # SPOKEN in dialect and TRANSCRIBED in standard German, so the reference is a
  # translation, not a transcript. WER counts every legitimate lexical choice
  # ("gäll" -> "nicht wahr") as a substitution and mismeasures that shape; such a
  # dataset is scored bleu+wer, and the BLEU is the headline of the pair.
  # "BLEU" alone is not a number (Post 2018, "A Call for Clarity in Reporting BLEU
  # Scores") — every convention that moves it is pinned here and mirrored by the
  # constants in raven_eval_core/bleu.py. tests/test_metric_contract.py fails the
  # build if the two ever disagree, in either direction.
  variants:
    - name: published               # the number we publish
      tokenize: 13a                 # mteval-v13a, the WMT default
      lowercase: false              # case-sensitive (signature reads case:mixed) — German capitalizes nouns
      smooth_method: exp            # sacrebleu default exponential smoothing, pinned rather than inherited
      effective_order: false        # all 4 orders at corpus level
      max_ngram_order: 4
  aggregation: corpus               # Σ n-gram stats over the subset, NEVER a mean of per-sentence BLEUs
  signature: sacrebleu              # every published BLEU carries its sacrebleu signature (e.g. nrefs:1|case:mixed|eff:no|tok:13a|smooth:exp|version:2.6.0) — that string, not the word "BLEU", is what makes it comparable
  also_reported: [sentence]         # raven_eval_core.bleu.sentence_bleu_diagnostic — per-row diagnostic under effective_order=True, not the published number

# Public datasets the Tier-2 full-rerun scores against. Audio is fetched by the
# harness itself (HF at a pinned revision / the official mirror); we never
# redistribute restricted audio. Every id below resolves to a loader in this
# repo, and every loader in this repo appears below — tests/test_dataset_contract.py
# fails the build in both directions, so this list cannot drift from the code.
datasets:
  der:
    - id: callhome-de        # talkbank/callhome, deu config — free, gold, German (2-spk telephone)
      hf: talkbank/callhome
      config: deu
      license: TalkBank (cite-to-use)
    - id: ami                # CC BY 4.0 — 4-speaker meetings
      license: CC-BY-4.0
    - id: voxconverse        # dev split; labels CC BY 4.0; audio = YouTube owners
      license: CC-BY-4.0 (labels)
    - id: voxconverse-test   # same corpus, TEST split — the split pyannote publishes its DER on
      license: CC-BY-4.0 (labels)
  wer:
    - id: fleurs             # google/fleurs config de_de, split test — read parallel sentences
      hf: google/fleurs
      config: de_de
      license: CC-BY-4.0
    - id: mls-de             # facebook/multilingual_librispeech config german, split test — LibriVox audiobooks
      hf: facebook/multilingual_librispeech
      config: german
      license: CC-BY-4.0
    - id: voxpopuli-de       # facebook/voxpopuli config de, split test — EU-Parliament plenary speech
      hf: facebook/voxpopuli
      config: de
      license: CC0-1.0
    - id: german-mixed       # avemio / flozi00 asr-german-mixed-evals (Tuda-De CC-BY-4.0, MLS CC-BY-4.0, CV CC0)
      hf: flozi00/asr-german-mixed-evals
      license: CC-BY-4.0 / CC0-1.0 (per subset)
    # Swiss German dialect corpora. Translation-shaped — Swiss German spoken,
    # Standard German written — so `metric: bleu+wer`. Each is reported on its
    # own: there is no aggregate spanning dialects and no dialect contribution to
    # any overall average.
    - id: spc-test           # Swiss Parliaments Corpus test, Bernese cantonal parliament
      hf: i4ds/SPC_test
      license: MIT (inferred from upstream FHNW SPC; the HF card carries no license tag)
      metric: bleu+wer
      acquisition: two test parquet shards by URL, sha256-verified (raven_asr/datasets/spc_test.py)
    - id: fhnw-all-dialects  # FHNW All Swiss German Dialects Test Set, SwissText 2021 task 3
      license: MIT
      metric: bleu+wer
      acquisition: Dropbox zip by URL, sha256-verified; durability vendor — a durable mirror is outstanding
    # ── Dialect probe + its control spur — read the publication rules below ──
    - id: xsid-bar           # xSID-audio v0.2, Bavarian (rural Upper Bavaria) read speech
      zenodo: "21605015"
      doi: 10.5281/zenodo.21605015
      version: "0.2"
      license: CC-BY-SA-4.0 (+ authors' no-speech-synthesis condition — see /NOTICE)
      representativeness: low
      eligible_for_aggregate: false
    - id: xsid-de-control    # SAME speaker, SAME sentences, Standard German
      zenodo: "21605015"
      doi: 10.5281/zenodo.21605015
      version: "0.2"
      license: CC-BY-SA-4.0 (+ authors' no-speech-synthesis condition — see /NOTICE)
      representativeness: low
      eligible_for_aggregate: false

# How the dialect rows above may and may not be published. These are not style
# preferences; each one names a way the number would otherwise mislead.
dialect_publication_rules:
  # One speaker, read speech. The number answers "does the model collapse on
  # Bavarian at all", not "how good is it on Bavarian".
  - no dialect row ever carries a winner mark, however many rows exist.
  # xsid-bar alone measures one voice. xsid-bar minus xsid-de-control measures
  # the dialect. Ship the pair or ship neither.
  - a dialect row is published only alongside its same-speaker control row.
  # A mean over Swiss German and Bavarian describes no population.
  - never form an aggregate that spans two dialect areas.
  # eligible_for_aggregate=false in raven_asr.config carries this in code.
  - dialect datasets stay out of any cross-dataset or `overall` average.
